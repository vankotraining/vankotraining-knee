name: Generate authentic npm lockfile

on:
  push:
    branches:
      - agent/tindeq-results-site
    paths:
      - .github/workflows/generate-npm-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile with standard npm install
        run: |
          set -euo pipefail
          npm --version
          npm install --no-audit --no-fund
          npm ls --depth=0
          test -f package-lock.json
          git diff --exit-code -- package.json
          cp package-lock.json /tmp/package-lock.before-ci.json

      - name: Verify clean npm ci is lockfile-stable
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund
          cmp --silent /tmp/package-lock.before-ci.json package-lock.json
          git diff --exit-code -- package.json
          echo "package-lock.json unchanged by npm ci"

      - name: Commit only the authentic lockfile
        run: |
          set -euo pipefail
          git fetch origin agent/tindeq-results-site
          test "$(git rev-parse origin/agent/tindeq-results-site)" = "$GITHUB_SHA"
          git rm .github/workflows/generate-npm-lockfile.yml
          git add package-lock.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add deterministic npm lockfile"
          git push origin HEAD:agent/tindeq-results-site
