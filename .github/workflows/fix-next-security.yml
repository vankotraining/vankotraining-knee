name: Apply Next.js security update

# One-time workflow: removes itself after a verified update.
on:
  push:
    branches:
      - feature/tindeq-repeaters-import
    paths:
      - .github/workflows/fix-next-security.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tindeq-repeaters-import
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install patched framework and transitive dependencies
        shell: bash
        run: |
          npm pkg set overrides.postcss=8.5.18
          npm pkg set overrides.sharp=0.35.0
          npm install --save-exact next@16.2.12 eslint-config-next@16.2.12

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - run: npm test
      - run: npm run check:types
      - run: npm run build
      - run: git diff --check

      - name: Commit verified security update
        shell: bash
        run: |
          rm .github/workflows/fix-next-security.yml
          rm -f .github/workflows/tindeq-dependency-audit.yml
          rm -rf .next .test-dist
          rm -f tsconfig.tsbuildinfo
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Next.js security dependencies"
          git push origin feature/tindeq-repeaters-import
