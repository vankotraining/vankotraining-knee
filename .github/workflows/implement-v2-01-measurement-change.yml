name: Implement V2-01 measurement change

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/implement-v2-01-measurement-change.yml
      - scripts/apply-v2-01-measurement-change.py
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check one-time implementation
        id: gate
        shell: bash
        run: |
          if [ -f scripts/apply-v2-01-measurement-change.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm install --silent

      - name: Record lint baseline
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint-before.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > /tmp/lint-before.exit
          cat /tmp/lint-before.log

      - name: Apply V2-01
        if: steps.gate.outputs.run == 'true'
        run: python scripts/apply-v2-01-measurement-change.py

      - name: Check patch formatting
        if: steps.gate.outputs.run == 'true'
        run: git diff --check

      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Run lint after change
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint-after.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > /tmp/lint-after.exit
          cat /tmp/lint-after.log

      - name: Verify lint baseline is unchanged
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import collections
          import json
          import re
          from pathlib import Path

          issue_pattern = re.compile(
              r"^\s*\d+:\d+\s+(error|warning)\s+.*?\s{2,}([@\w/-]+)\s*$"
          )

          def parse(path: str):
              current_file = None
              issues = []
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if stripped.startswith("/") and stripped.endswith((".ts", ".tsx", ".js", ".jsx")):
                      marker = "/src/"
                      current_file = "src/" + stripped.split(marker, 1)[1] if marker in stripped else stripped
                      continue
                  match = issue_pattern.match(line)
                  if match and current_file:
                      severity, rule = match.groups()
                      issues.append((current_file, severity, rule))
              return collections.Counter(issues)

          before_status = int(Path("/tmp/lint-before.exit").read_text().strip())
          after_status = int(Path("/tmp/lint-after.exit").read_text().strip())
          before = parse("/tmp/lint-before.log")
          after = parse("/tmp/lint-after.log")

          if before_status == 0:
              if after_status != 0 or after:
                  raise SystemExit(f"Lint regressed from PASS: {after}")
              summary = "PASS před změnou i po změně"
          else:
              if after != before:
                  raise SystemExit(
                      "Lint issue signature changed.\n"
                      f"Before: {before}\nAfter: {after}\n"
                      + Path("/tmp/lint-after.log").read_text(encoding="utf-8")
                  )
              summary = (
                  f"známý výchozí stav beze změny; exit code {after_status}; "
                  f"{sum(after.values())} problémů"
              )

          Path("/tmp/lint-summary.json").write_text(
              json.dumps(
                  {
                      "before_status": before_status,
                      "after_status": after_status,
                      "issue_count": sum(after.values()),
                      "summary": summary,
                      "issues": [
                          {"file": file, "severity": severity, "rule": rule, "count": count}
                          for (file, severity, rule), count in sorted(after.items())
                      ],
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(summary)
          PY

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: npm run build

      - name: Finalize project-control verification
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("project-control/v2-01-measurement-change-2026-07-31.md")
          text = path.read_text(encoding="utf-8")
          lint = json.loads(Path("/tmp/lint-summary.json").read_text(encoding="utf-8"))
          details = [
              "- `npm test`: PASS.",
              f"- `npm run lint`: {lint['summary']}.",
              "- Lint byl porovnán s výchozím stavem podle souboru, závažnosti a pravidla; změna nepřidala nový lint problém.",
              "- `npm run build`: PASS.",
              "- `git diff --check`: PASS.",
          ]
          marker = "{{TECHNICAL_VERIFICATION}}"
          if marker not in text:
              raise SystemExit("Missing technical verification marker")
          path.write_text(text.replace(marker, "\n".join(details)), encoding="utf-8")
          PY

      - name: Commit verified implementation
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          rm .github/workflows/implement-v2-01-measurement-change.yml
          rm scripts/apply-v2-01-measurement-change.py
          rm -rf .test-dist .next
          rm -f package-lock.json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement V2-01 measurement change comparison"
          git push origin main
