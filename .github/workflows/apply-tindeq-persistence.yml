name: Apply Tindeq persistence implementation

on:
  push:
    branches:
      - agent/tindeq-results-site

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage Tindeq persistence implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/tindeq-results-site

      - name: Apply reviewed workspace files
        shell: bash
        run: |
          cat .github/tindeq-payload/part-* > /tmp/tindeq-changes.b64
          base64 --decode /tmp/tindeq-changes.b64 > /tmp/tindeq-changes.tgz
          tar -xzf /tmp/tindeq-changes.tgz -C .
          rm -rf .github/tindeq-payload
          rm -f .github/workflows/apply-tindeq-persistence.yml
          rm -f .github/workflows/export-agent-source.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Connect Tindeq results to Supabase"
          git push origin HEAD:agent/tindeq-results-site
