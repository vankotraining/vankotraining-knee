name: Verify mobile norm completion PR

on:
  pull_request:
    branches:
      - main
    paths:
      - src/app/components/KneeDashboard.tsx
      - src/lib/knee-metrics.ts
      - src/lib/knee-metrics.test.ts
      - project-control/mobile-norm-completion-2026-07-30.md

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout proposed change
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install base dependencies
        working-directory: base
        run: npm install --silent

      - name: Capture base lint
        id: lint_before
        working-directory: base
        run: |
          set +e
          npm run lint > /tmp/lint-before.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/lint-before.log

      - name: Install proposed dependencies
        working-directory: head
        run: npm install --silent

      - name: Run tests
        working-directory: head
        run: npm test

      - name: Capture proposed lint
        id: lint_after
        working-directory: head
        run: |
          set +e
          npm run lint > /tmp/lint-after.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/lint-after.log

      - name: Verify lint signature is unchanged
        env:
          BEFORE_STATUS: ${{ steps.lint_before.outputs.status }}
          AFTER_STATUS: ${{ steps.lint_after.outputs.status }}
        run: |
          python <<'PY'
          from collections import Counter
          from pathlib import Path
          import os
          import re

          def parse_issues(path: str) -> Counter[tuple[str, str, str]]:
              current_file = "unknown"
              issues: Counter[tuple[str, str, str]] = Counter()

              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if stripped.startswith("/") and "/src/" in stripped:
                      current_file = "src/" + stripped.split("/src/", 1)[1]
                      continue

                  match = re.match(
                      r"^\s*\d+:\d+\s+(error|warning)\s+.*?\s+(\S+)\s*$",
                      line,
                  )
                  if match:
                      severity, rule = match.groups()
                      issues[(current_file, severity, rule)] += 1

              return issues

          before_status = int(os.environ["BEFORE_STATUS"])
          after_status = int(os.environ["AFTER_STATUS"])
          before = parse_issues("/tmp/lint-before.log")
          after = parse_issues("/tmp/lint-after.log")

          if before_status != after_status or before != after:
              print("Lint baseline changed.")
              print("Before status:", before_status)
              print("After status:", after_status)
              print("Removed:", before - after)
              print("Added:", after - before)
              raise SystemExit(1)

          errors = sum(count for (_, severity, _), count in after.items() if severity == "error")
          warnings = sum(count for (_, severity, _), count in after.items() if severity == "warning")
          print(f"Lint signature unchanged: {errors} errors, {warnings} warnings.")
          PY

      - name: Run production build
        working-directory: head
        run: npm run build
