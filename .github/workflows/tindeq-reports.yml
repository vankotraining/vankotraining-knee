name: Verify Tindeq reports

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/tindeq/**"
      - "src/lib/tindeq-*.ts"
      - "tests/e2e/tindeq-reports.spec.ts"
      - "tsconfig.test.json"
      - ".github/workflows/tindeq-reports.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/tindeq-reports.spec.ts --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tindeq-reports-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
