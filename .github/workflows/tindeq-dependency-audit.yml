name: Inspect Tindeq dependency audit

on:
  push:
    branches:
      - feature/tindeq-repeaters-import
    paths:
      - .github/workflows/tindeq-dependency-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print production dependency audit
        shell: bash
        run: npm audit --omit=dev --json || true
