name: Verify Tindeq client view

on:
  push:
    branches:
      - agent/tindeq-results-site
      - feature/tindeq-client-view
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tindeq-results-site
          fetch-depth: 0

      - name: Apply reviewed visual fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          analyzer = Path("src/app/tindeq/TindeqAnalyzer.tsx")
          text = analyzer.read_text(encoding="utf-8")
          new_tone = '''function toneForStatus(value: string) {
            const normalized = value.toLocaleLowerCase("cs-CZ");
            if (
              normalized.includes("bez výrazného poklesu") ||
              normalized.includes("bez poklesu")
            ) {
              return styles.good;
            }
            if (
              normalized.includes("výrazná odchylka") ||
              normalized.includes("výraznější odchylka") ||
              normalized.includes("výrazný pokles") ||
              normalized.includes("výraznější pokles") ||
              normalized.includes("výrazně kolísavá") ||
              normalized.includes("nestabil") ||
              normalized.includes("nelze vyhodnotit")
            ) {
              return styles.problem;
            }
            if (
              normalized.includes("kontrole") ||
              normalized.includes("mírný") ||
              normalized.includes("kolísavá")
            ) {
              return styles.warning;
            }
            if (
              normalized.includes("dobrá") ||
              normalized.includes("dobře") ||
              normalized.includes("stabilní")
            ) {
              return styles.good;
            }
            return styles.neutral;
          }'''
          text, count = re.subn(
              r'function toneForStatus\(value: string\) \{.*?\n\}\n\nfunction medianCurve',
              new_tone + "\n\nfunction medianCurve",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"toneForStatus replacement count: {count}")

          compact_upload = '''      {sessions.length === 0 ? (
                <section className={styles.uploadCard}>
                  <label className={styles.uploadLabel}>
                    <input
                      accept=".zip,application/zip,application/x-zip-compressed"
                      disabled={state === "loading"}
                      onChange={(event) => handleFile(event.target.files?.[0] ?? null)}
                      type="file"
                    />
                    <span className={styles.uploadIcon} aria-hidden="true">＋</span>
                    <strong>{state === "loading" ? "Analyzuji soubor…" : "Nahrát Tindeq ZIP"}</strong>
                    <small>Jednotlivý export nebo ZIP s více exporty</small>
                  </label>
                  <p className={styles.privacyNote}>
                    Data zůstávají v zařízení a po obnovení stránky se smažou.
                  </p>
                </section>
              ) : (
                <div className={styles.reuploadBar}>
                  <label className={styles.reuploadLabel}>
                    <input
                      accept=".zip,application/zip,application/x-zip-compressed"
                      disabled={state === "loading"}
                      onChange={(event) => handleFile(event.target.files?.[0] ?? null)}
                      type="file"
                    />
                    <span aria-hidden="true">↻</span>
                    <strong>Nahrát jiný Tindeq ZIP</strong>
                  </label>
                </div>
              )}

              {state === "error"'''
          text, count = re.subn(
              r'      <section className=\{styles\.uploadCard\}>.*?      </section>\n\n      \{state === "error"',
              compact_upload,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"upload replacement count: {count}")
          analyzer.write_text(text, encoding="utf-8")

          css = Path("src/app/tindeq/tindeq.module.css")
          text = css.read_text(encoding="utf-8")
          text = text.replace(
              ".backLink:focus-visible,\n.uploadLabel:has(input:focus-visible),\n.sessionTabs button:focus-visible,",
              ".backLink:focus-visible,\n.uploadLabel:has(input:focus-visible),\n.reuploadLabel:has(input:focus-visible),\n.sessionTabs button:focus-visible,",
              1,
          )
          privacy = '''.privacyNote {
            margin: 10px 2px 0;
            font-size: 12px;
            text-align: center;
          }
          '''
          reupload = '''.privacyNote {
            margin: 10px 2px 0;
            font-size: 12px;
            text-align: center;
          }

          .reuploadBar {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
          }

          .reuploadLabel {
            position: relative;
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border, #dfe4d8);
            border-radius: 8px;
            background: var(--surface, #fff);
            color: var(--foreground, #161a15);
            padding: 9px 13px;
            cursor: pointer;
            font-size: 13px;
          }

          .reuploadLabel:hover {
            border-color: var(--accent, #23604a);
            background: #f6fbf8;
          }

          .reuploadLabel input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          }

          .reuploadLabel span {
            color: var(--accent, #23604a);
            font-size: 20px;
            line-height: 1;
          }
          '''
          if ".reuploadBar {" not in text:
              if privacy not in text:
                  raise SystemExit("privacy CSS anchor missing")
              text = text.replace(privacy, reupload, 1)
          mobile = '''  .detailButton {
            width: 100%;
          }
          }'''
          mobile_new = '''  .reuploadBar {
            justify-content: stretch;
          }

          .reuploadLabel,
          .detailButton {
            width: 100%;
          }
          }'''
          if mobile in text:
              text = text.replace(mobile, mobile_new, 1)
          elif ".reuploadLabel,\n  .detailButton" not in text:
              raise SystemExit("mobile CSS anchor missing")
          css.write_text(text, encoding="utf-8")

          e2e = Path("tests/e2e/tindeq-client-view.spec.ts")
          text = e2e.read_text(encoding="utf-8")
          heading_anchor = '''  await expect(page.getByRole("heading", { name: "Velmi dobrá série" })).toBeVisible();
          '''
          heading_insert = '''  await expect(page.getByRole("heading", { name: "Velmi dobrá série" })).toBeVisible();
            await expect(page.getByText("Nahrát jiný Tindeq ZIP", { exact: true })).toBeVisible();
            await expect(page.getByText("Nahrát Tindeq ZIP", { exact: true })).toHaveCount(0);
          '''
          if "Nahrát jiný Tindeq ZIP" not in text:
              if heading_anchor not in text:
                  raise SystemExit("E2E heading anchor missing")
              text = text.replace(heading_anchor, heading_insert, 1)
          graph_anchor = '''  await expect(page.getByRole("img")).toHaveAttribute(
              "aria-label",
              /průběhu síly levé a pravé nohy/i,
            );
          '''
          graph_insert = '''  await expect(page.getByRole("img")).toHaveAttribute(
              "aria-label",
              /průběhu síly levé a pravé nohy/i,
            );

            const stabilityColor = await page
              .getByText("Velmi stabilní", { exact: true })
              .first()
              .evaluate((element) => getComputedStyle(element).color);
            const maintenanceColor = await page
              .getByText("Bez výrazného poklesu", { exact: true })
              .evaluate((element) => getComputedStyle(element).color);
            expect(maintenanceColor).toBe(stabilityColor);
          '''
          if "const maintenanceColor" not in text:
              if graph_anchor not in text:
                  raise SystemExit("E2E graph anchor missing")
              text = text.replace(graph_anchor, graph_insert, 1)
          e2e.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/tindeq/TindeqAnalyzer.tsx src/app/tindeq/tindeq.module.css tests/e2e/tindeq-client-view.spec.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix Tindeq client result visual details"
            git push origin HEAD:agent/tindeq-results-site
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Compare lint with current main
        shell: bash
        run: |
          set +e
          npm run lint > branch-lint.log 2>&1
          branch_status=$?
          set -e
          cat branch-lint.log

          git fetch origin main
          git worktree add ../main-worktree origin/main
          pushd ../main-worktree
          npm install --no-audit --no-fund
          set +e
          npm run lint > ../main-lint.log 2>&1
          main_status=$?
          set -e
          popd
          cat ../main-lint.log

          BRANCH_STATUS="$branch_status" MAIN_STATUS="$main_status" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def error_count(path: str) -> int:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              match = re.search(r"(\d+) problems? \((\d+) errors?, (\d+) warnings?\)", text)
              if match:
                  return int(match.group(2))
              return len(re.findall(r"\berror\b", text, flags=re.IGNORECASE))

          branch_status = int(os.environ["BRANCH_STATUS"])
          main_status = int(os.environ["MAIN_STATUS"])
          branch_errors = error_count("branch-lint.log")
          main_errors = error_count("../main-lint.log")
          print(f"main lint: status={main_status}, errors={main_errors}")
          print(f"branch lint: status={branch_status}, errors={branch_errors}")
          if main_status == 0 and branch_status != 0:
              raise SystemExit("Branch lint failed while current main lint passed.")
          if branch_errors > main_errors:
              raise SystemExit("Branch introduces additional lint errors compared with current main.")
          PY

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Tindeq in browser
        run: npm run test:e2e

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tindeq-client-view-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
