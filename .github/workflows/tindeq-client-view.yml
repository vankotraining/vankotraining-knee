name: Verify Tindeq client view

on:
  push:
    branches:
      - agent/tindeq-results-site
      - feature/tindeq-client-view
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply_persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/tindeq-results-site

      - name: Check one-time trigger
        id: guard
        shell: bash
        run: |
          if [[ -f .github/tindeq-payload/trigger ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed implementation
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          cat .github/tindeq-payload/part-* > /tmp/tindeq-changes.b64
          base64 --decode /tmp/tindeq-changes.b64 > /tmp/tindeq-changes.tgz
          tar -xzf /tmp/tindeq-changes.tgz -C .
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('src/app/tindeq/TindeqWorkspace.tsx')
          text = workspace.read_text()
          text = text.replace(
              '''function mean(values: Array<number | null | undefined>) {
            const finite = values
              .map((value) => Number(value))
              .filter((value) => Number.isFinite(value));
          ''',
              '''function mean(values: Array<number | null | undefined>) {
            const finite = values
              .filter((value): value is number => value !== null && value !== undefined)
              .map((value) => Number(value))
              .filter((value) => Number.isFinite(value));
          ''',
          )
          workspace.write_text(text)

          spec = Path('tests/e2e/tindeq-client-view.spec.ts')
          text = spec.read_text()
          text = text.replace(
              '  const historySection = page.getByRole("heading", { name: "Uložená Tindeq měření" }).locator("..");\n',
              '  const historySection = page\n    .getByRole("heading", { name: "Uložená Tindeq měření" })\n    .locator("xpath=ancestor::section[1]");\n',
          )
          spec.write_text(text)

          migration = Path('supabase/migrations/20260802_tindeq_sessions.sql')
          text = migration.read_text()
          text = text.replace(
              'grant execute on function public.soft_delete_tindeq_session(uuid, text) to authenticated;\ngrant execute on function public.restore_tindeq_session(uuid) to authenticated;\n',
              'revoke all on function public.soft_delete_tindeq_session(uuid, text) from public, anon;\nrevoke all on function public.restore_tindeq_session(uuid) from public, anon;\ngrant execute on function public.soft_delete_tindeq_session(uuid, text) to authenticated;\ngrant execute on function public.restore_tindeq_session(uuid) to authenticated;\n',
          )
          migration.write_text(text)

          test_path = Path('src/lib/tindeq-persistence.test.ts')
          text = test_path.read_text()
          needle = '''test("payload vždy zapisuje podporovanou analysis_version", () => {
            assert.equal(mapTindeqSessionToInsert(fixture(), athleteId).analysis_version, TINDEQ_ANALYSIS_VERSION);
          });
          '''
          replacement = needle + '''
          test("validace odmítne nepodporovanou analysis_version", () => {
            const errors = validateTindeqSessionForSave(
              fixture(),
              athleteId,
              "tindeq-repeaters-v0",
            );
            assert.match(errors.join(" "), /nepodporovanou verzi/);
          });
          '''
          if needle not in text:
              raise SystemExit('test insertion point not found')
          test_path.write_text(text.replace(needle, replacement))
          PY
          rm -rf .github/tindeq-payload
          rm -f .github/workflows/apply-tindeq-persistence.yml
          rm -f .github/workflows/export-agent-source.yml

      - name: Commit implementation
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Connect Tindeq results to Supabase"
          git push origin HEAD:agent/tindeq-results-site

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Compare lint with current main
        shell: bash
        run: |
          set +e
          npm run lint > branch-lint.log 2>&1
          branch_status=$?
          set -e
          cat branch-lint.log

          git fetch origin main
          git worktree add ../main-worktree origin/main
          pushd ../main-worktree
          npm install --no-audit --no-fund
          set +e
          npm run lint > ../main-lint.log 2>&1
          main_status=$?
          set -e
          popd
          cat ../main-lint.log

          BRANCH_STATUS="$branch_status" MAIN_STATUS="$main_status" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def error_count(path: str) -> int:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              match = re.search(r"(\d+) problems? \((\d+) errors?, (\d+) warnings?\)", text)
              if match:
                  return int(match.group(2))
              return len(re.findall(r"\berror\b", text, flags=re.IGNORECASE))

          branch_status = int(os.environ["BRANCH_STATUS"])
          main_status = int(os.environ["MAIN_STATUS"])
          branch_errors = error_count("branch-lint.log")
          main_errors = error_count("../main-lint.log")
          print(f"main lint: status={main_status}, errors={main_errors}")
          print(f"branch lint: status={branch_status}, errors={branch_errors}")
          if main_status == 0 and branch_status != 0:
              raise SystemExit("Branch lint failed while current main lint passed.")
          if branch_errors > main_errors:
              raise SystemExit("Branch introduces additional lint errors compared with current main.")
          PY

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Tindeq in browser
        run: npm run test:e2e

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tindeq-client-view-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Package exact source for agent workspace
        if: always()
        run: git archive --format=zip --output=agent-source.zip HEAD

      - name: Upload exact source for agent workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-source
          path: agent-source.zip
          retention-days: 1
