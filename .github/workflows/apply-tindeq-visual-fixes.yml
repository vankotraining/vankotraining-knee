name: Apply Tindeq visual fixes

on:
  push:
    branches:
      - agent/tindeq-results-site

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tindeq-results-site
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/app/tindeq/TindeqAnalyzer.tsx",
              '''function toneForStatus(value: string) {
            const normalized = value.toLocaleLowerCase("cs-CZ");
            if (
              normalized.includes("výraz") ||
              normalized.includes("nestabil") ||
              normalized.includes("nelze vyhodnotit")
            ) {
              return styles.problem;
            }
            if (
              normalized.includes("kontrole") ||
              normalized.includes("mírný") ||
              normalized.includes("kolísavá")
            ) {
              return styles.warning;
            }
            if (
              normalized.includes("dobrá") ||
              normalized.includes("dobře") ||
              normalized.includes("stabilní") ||
              normalized.includes("bez výrazného poklesu") ||
              normalized.includes("bez poklesu")
            ) {
              return styles.good;
            }
            return styles.neutral;
          }''',
              '''function toneForStatus(value: string) {
            const normalized = value.toLocaleLowerCase("cs-CZ");
            if (
              normalized.includes("bez výrazného poklesu") ||
              normalized.includes("bez poklesu")
            ) {
              return styles.good;
            }
            if (
              normalized.includes("výrazná odchylka") ||
              normalized.includes("výraznější odchylka") ||
              normalized.includes("výrazný pokles") ||
              normalized.includes("výraznější pokles") ||
              normalized.includes("výrazně kolísavá") ||
              normalized.includes("nestabil") ||
              normalized.includes("nelze vyhodnotit")
            ) {
              return styles.problem;
            }
            if (
              normalized.includes("kontrole") ||
              normalized.includes("mírný") ||
              normalized.includes("kolísavá")
            ) {
              return styles.warning;
            }
            if (
              normalized.includes("dobrá") ||
              normalized.includes("dobře") ||
              normalized.includes("stabilní")
            ) {
              return styles.good;
            }
            return styles.neutral;
          }''',
          )

          replace_once(
              "src/app/tindeq/TindeqAnalyzer.tsx",
              '''      <section className={styles.uploadCard}>
                <label className={styles.uploadLabel}>
                  <input
                    accept=".zip,application/zip,application/x-zip-compressed"
                    disabled={state === "loading"}
                    onChange={(event) => handleFile(event.target.files?.[0] ?? null)}
                    type="file"
                  />
                  <span className={styles.uploadIcon} aria-hidden="true">＋</span>
                  <strong>{state === "loading" ? "Analyzuji soubor…" : "Nahrát Tindeq ZIP"}</strong>
                  <small>Jednotlivý export nebo ZIP s více exporty</small>
                </label>
                <p className={styles.privacyNote}>
                  Data zůstávají v zařízení a po obnovení stránky se smažou.
                </p>
              </section>''',
              '''      {sessions.length === 0 ? (
                <section className={styles.uploadCard}>
                  <label className={styles.uploadLabel}>
                    <input
                      accept=".zip,application/zip,application/x-zip-compressed"
                      disabled={state === "loading"}
                      onChange={(event) => handleFile(event.target.files?.[0] ?? null)}
                      type="file"
                    />
                    <span className={styles.uploadIcon} aria-hidden="true">＋</span>
                    <strong>{state === "loading" ? "Analyzuji soubor…" : "Nahrát Tindeq ZIP"}</strong>
                    <small>Jednotlivý export nebo ZIP s více exporty</small>
                  </label>
                  <p className={styles.privacyNote}>
                    Data zůstávají v zařízení a po obnovení stránky se smažou.
                  </p>
                </section>
              ) : (
                <div className={styles.reuploadBar}>
                  <label className={styles.reuploadLabel}>
                    <input
                      accept=".zip,application/zip,application/x-zip-compressed"
                      disabled={state === "loading"}
                      onChange={(event) => handleFile(event.target.files?.[0] ?? null)}
                      type="file"
                    />
                    <span aria-hidden="true">↻</span>
                    <strong>Nahrát jiný Tindeq ZIP</strong>
                  </label>
                </div>
              )}''',
          )

          replace_once(
              "src/app/tindeq/tindeq.module.css",
              '''.backLink:focus-visible,
          .uploadLabel:has(input:focus-visible),
          .sessionTabs button:focus-visible,''',
              '''.backLink:focus-visible,
          .uploadLabel:has(input:focus-visible),
          .reuploadLabel:has(input:focus-visible),
          .sessionTabs button:focus-visible,''',
          )

          replace_once(
              "src/app/tindeq/tindeq.module.css",
              '''.privacyNote {
            margin: 10px 2px 0;
            font-size: 12px;
            text-align: center;
          }

          .errorBox,''',
              '''.privacyNote {
            margin: 10px 2px 0;
            font-size: 12px;
            text-align: center;
          }

          .reuploadBar {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
          }

          .reuploadLabel {
            position: relative;
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border, #dfe4d8);
            border-radius: 8px;
            background: var(--surface, #fff);
            color: var(--foreground, #161a15);
            padding: 9px 13px;
            cursor: pointer;
            font-size: 13px;
          }

          .reuploadLabel:hover {
            border-color: var(--accent, #23604a);
            background: #f6fbf8;
          }

          .reuploadLabel input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          }

          .reuploadLabel span {
            color: var(--accent, #23604a);
            font-size: 20px;
            line-height: 1;
          }

          .errorBox,''',
          )

          replace_once(
              "src/app/tindeq/tindeq.module.css",
              '''  .detailButton {
              width: 100%;
            }
          }''',
              '''  .reuploadBar {
              justify-content: stretch;
            }

            .reuploadLabel,
            .detailButton {
              width: 100%;
            }
          }''',
          )

          replace_once(
              "tests/e2e/tindeq-client-view.spec.ts",
              '''  await expect(page.getByRole("heading", { name: "Velmi dobrá série" })).toBeVisible();
            await expect(page.getByText("Dosažení cílové síly", { exact: true }).first()).toBeVisible();''',
              '''  await expect(page.getByRole("heading", { name: "Velmi dobrá série" })).toBeVisible();
            await expect(page.getByText("Nahrát jiný Tindeq ZIP", { exact: true })).toBeVisible();
            await expect(page.getByText("Nahrát Tindeq ZIP", { exact: true })).toHaveCount(0);
            await expect(page.getByText("Dosažení cílové síly", { exact: true }).first()).toBeVisible();''',
          )

          replace_once(
              "tests/e2e/tindeq-client-view.spec.ts",
              '''  await expect(page.getByRole("img")).toHaveAttribute(
              "aria-label",
              /průběhu síly levé a pravé nohy/i,
            );

            for (const width of [360, 390, 720, 1024, 1440]) {''',
              '''  await expect(page.getByRole("img")).toHaveAttribute(
              "aria-label",
              /průběhu síly levé a pravé nohy/i,
            );

            const stabilityColor = await page
              .getByText("Velmi stabilní", { exact: true })
              .first()
              .evaluate((element) => getComputedStyle(element).color);
            const maintenanceColor = await page
              .getByText("Bez výrazného poklesu", { exact: true })
              .evaluate((element) => getComputedStyle(element).color);
            expect(maintenanceColor).toBe(stabilityColor);

            for (const width of [360, 390, 720, 1024, 1440]) {''',
          )
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/tindeq/TindeqAnalyzer.tsx src/app/tindeq/tindeq.module.css tests/e2e/tindeq-client-view.spec.ts
          git diff --cached --check
          git commit -m "Fix Tindeq client result visual details"
          git push origin HEAD:agent/tindeq-results-site
