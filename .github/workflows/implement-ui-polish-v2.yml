name: Implement UI polish v2

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-ui-polish-v2.py
      - .github/workflows/implement-ui-polish-v2.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: implement-ui-polish-v2
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[ui-polish-diagnostic]') && !contains(github.event.head_commit.message, '[ui-polish-final]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply, verify and commit
        shell: bash
        run: |
          set -u
          LOG=/tmp/ui-polish-v2.log
          WORKFLOW=.github/workflows/implement-ui-polish-v2.yml
          BASE_COMMIT=a20a6157330f46e3396e2ef1a2e7206c82835965
          : > "$LOG"

          record_failure() {
            reason="$1"
            set +e
            echo "UI_POLISH_FAILURE reason=$reason" >&2
            echo "--- verification log tail ---" >&2
            tail -n 200 "$LOG" >&2
            echo "--- git status ---" >&2
            git status --short >&2
            exit 1
          }

          git merge-base --is-ancestor "$BASE_COMMIT" HEAD >> "$LOG" 2>&1 || record_failure "baseline-ancestor"
          unexpected="$({ git diff --name-only "$BASE_COMMIT"..HEAD || true; } | grep -Ev '^(scripts/apply-ui-polish-v2\.py|\.github/workflows/implement-ui-polish-v2\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected source changes: $unexpected" >> "$LOG"
            record_failure "baseline-files"
          fi

          npm install --silent >> "$LOG" 2>&1 || record_failure "npm-install"

          rm -rf .test-dist
          set +e
          npm run lint -- --format json --output-file /tmp/lint-before.json >> "$LOG" 2>&1
          lint_before_status=$?
          set -e
          test -s /tmp/lint-before.json || record_failure "lint-baseline-output"

          python scripts/apply-ui-polish-v2.py >> "$LOG" 2>&1 || record_failure "apply-script"
          git diff --check >> "$LOG" 2>&1 || record_failure "git-diff-check-after-apply"

          python - <<'PY' >> "$LOG" 2>&1 || record_failure "static-audit"
          from pathlib import Path

          dashboard = Path("src/app/components/KneeDashboard.tsx").read_text(encoding="utf-8")
          css = Path("src/app/globals.css").read_text(encoding="utf-8")
          archives = "\n".join(
              Path(path).read_text(encoding="utf-8")
              for path in [
                  "src/app/components/ArchivedClients.tsx",
                  "src/app/components/ArchivedMeasurements.tsx",
                  "src/app/components/ClientDeletion.tsx",
              ]
          )

          for marker in [
              'placeholder="vas@email.cz"', 'login-email-field', 'role="tab"',
              'aria-selected={mobileTab === tab.key}',
              'aria-controls={`mobile-panel-${tab.key}`}', 'role="tabpanel"',
              'aria-labelledby="mobile-tab-measurements"',
              'onKeyDown={handleMobileTabKeyDown}',
              'className="mobile-sticky-controls"', 'client-context-meta',
              'Změna oproti měření',
          ]:
              assert marker in dashboard, marker

          for marker in [
              'martin@vankotraining.cz', 'Prihlaseni trenera',
              '>Mereni</button>', '>Porovnani</button>', '>Odhlasit</button>',
              '>Zavrit</button>', '>Poznamka',
          ]:
              assert marker not in dashboard, marker

          for marker in [
              ':focus-visible', 'max-width: 580px', '.mobile-sticky-controls',
              'top: calc(45px + env(safe-area-inset-top))',
              '@media (min-width: 721px)',
          ]:
              assert marker in css, marker

          for marker in [
              'Archiv klientu', 'Archiv mereni', 'Zavrit', 'Otevrit',
              'Archivovano', 'celeho klienta',
          ]:
              assert marker not in archives, marker
          PY

          npm test >> "$LOG" 2>&1 || record_failure "npm-test"
          rm -rf .test-dist

          set +e
          npm run lint -- --format json --output-file /tmp/lint-after.json >> "$LOG" 2>&1
          lint_after_status=$?
          set -e
          test -s /tmp/lint-after.json || record_failure "lint-after-output"

          LINT_BEFORE_STATUS="$lint_before_status" LINT_AFTER_STATUS="$lint_after_status" python - <<'PY' >> "$LOG" 2>&1 || record_failure "lint-regression"
          import json
          import os
          from collections import Counter
          from pathlib import Path

          def issues(path: str) -> Counter:
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              found = Counter()
              for result in data:
                  file_path = result.get("filePath", "").replace("\\", "/")
                  if "/.test-dist/" in file_path:
                      continue
                  relative = file_path.split("/vankotraining-knee/")[-1]
                  for message in result.get("messages", []):
                      found[(relative, message.get("severity"), message.get("ruleId"), message.get("message"))] += 1
              return found

          before = issues("/tmp/lint-before.json")
          after = issues("/tmp/lint-after.json")
          regressions = after - before
          if regressions:
              print(regressions)
              raise SystemExit("New lint issue introduced")

          Path("/tmp/lint-summary.json").write_text(
              json.dumps({
                  "before_status": int(os.environ["LINT_BEFORE_STATUS"]),
                  "after_status": int(os.environ["LINT_AFTER_STATUS"]),
                  "before_count": sum(before.values()),
                  "after_count": sum(after.values()),
              }),
              encoding="utf-8",
          )
          PY

          npm run build >> "$LOG" 2>&1 || record_failure "npm-build"

          mkdir -p /tmp/ui-polish-v2-screenshots
          npm run start -- --hostname 127.0.0.1 >> "$LOG" 2>&1 &
          server_pid=$!
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 > /tmp/ui-polish-v2.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            kill "$server_pid" 2>/dev/null || true
            record_failure "local-server"
          fi
          grep -q "Knee extension" /tmp/ui-polish-v2.html || record_failure "local-html-content"
          if grep -Eq "Internal Server Error|Application error|nextjs-portal" /tmp/ui-polish-v2.html; then
            record_failure "local-next-error"
          fi

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || record_failure "chrome-missing"
          for width in 360 390 720 1024 1440; do
            "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=2500 --window-size="${width},1200" \
              --screenshot="/tmp/ui-polish-v2-screenshots/login-${width}.png" \
              http://127.0.0.1:3000 >> "$LOG" 2>&1 || record_failure "chrome-screenshot-${width}"
            test -s "/tmp/ui-polish-v2-screenshots/login-${width}.png" || record_failure "empty-screenshot-${width}"
          done
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 \
            --dump-dom http://127.0.0.1:3000 > /tmp/ui-polish-v2-dom.html 2>> "$LOG" || record_failure "chrome-dom"
          kill "$server_pid" 2>/dev/null || true
          grep -Eq "Přihlášení trenéra|Chybí Supabase konfigurace" /tmp/ui-polish-v2-dom.html || record_failure "login-dom"
          if grep -Eq "Internal Server Error|Application error|nextjs-portal" /tmp/ui-polish-v2-dom.html; then
            record_failure "browser-next-error"
          fi

          python - <<'PY' >> "$LOG" 2>&1 || record_failure "project-control-finalize"
          import json
          from pathlib import Path

          lint = json.loads(Path("/tmp/lint-summary.json").read_text(encoding="utf-8"))
          if lint["before_status"] == 0 and lint["after_status"] == 0:
              lint_result = "PASS; projekt neměl lint chyby před změnou ani po změně."
          else:
              lint_result = (
                  f"Výchozí lint skončil stavem {lint['before_status']} s {lint['before_count']} hlášeními; "
                  f"lint po změně skončil stavem {lint['after_status']} s {lint['after_count']} hlášeními. "
                  "Porovnání podle souboru, pravidla a zprávy potvrdilo, že změna nepřidala nový lint problém."
              )

          technical = f'''- `npm test`: PASS (existující výpočetní testy včetně normy a V2-01).
          - `npm run lint`: {lint_result}
          - `npm run build`: PASS.
          - `git diff --check`: PASS.
          - Statický audit přihlášení, sticky struktury, českých textů, focus stavů a ARIA vazeb: PASS.'''
          browser = '''- Produkční Next.js bundle byl spuštěn lokálně pomocí `npm run start` a stránka odpověděla přes HTTP bez Next.js error stránky.
          - Headless Chrome vytvořil screenshoty při šířkách 360, 390, 720, 1024 a 1440 px; artefakt workflow: `ui-polish-v2-responsive-screenshots`.
          - DOM kontrola potvrdila viditelnou přihlašovací obrazovku nebo korektní stav chybějící konfigurace a nezachytila Next.js error overlay.
          - Přihlášené datové obrazovky nebylo možné v CI vizuálně otevřít bez magic-link session; jejich přesný produkční průchod zůstává v ručním checklistu.'''
          path = Path("project-control/ui-polish-v2-2026-08-02.md")
          text = path.read_text(encoding="utf-8")
          assert "{{TECHNICAL_VERIFICATION}}" in text
          assert "{{BROWSER_VERIFICATION}}" in text
          path.write_text(
              text.replace("{{TECHNICAL_VERIFICATION}}", technical).replace("{{BROWSER_VERIFICATION}}", browser),
              encoding="utf-8",
          )
          PY

          git diff --check >> "$LOG" 2>&1 || record_failure "final-diff-check"
          rm -rf .test-dist .next
          if ! git cat-file -e "$BASE_COMMIT:package-lock.json" 2>/dev/null; then
            rm -f package-lock.json
          fi
          rm -f scripts/apply-ui-polish-v2.py
          git fetch origin main >> "$LOG" 2>&1 || record_failure "git-fetch"
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            record_failure "main-changed"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check >> "$LOG" 2>&1 || record_failure "cached-diff-check"
          git commit -m "Implement UI polish v2 [ui-polish-final]" >> "$LOG" 2>&1 || record_failure "git-commit"
          git push origin HEAD:main >> "$LOG" 2>&1 || record_failure "git-push"

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-polish-v2-responsive-screenshots
          path: /tmp/ui-polish-v2-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
