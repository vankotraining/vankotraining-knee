name: Export agent source

on:
  push:
    branches:
      - agent/tindeq-results-site
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source
        run: |
          git archive --format=zip --output=agent-source.zip HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: agent-source
          path: agent-source.zip
          retention-days: 1
